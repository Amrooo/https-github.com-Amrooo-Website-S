<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="45%" stop-color="#18181b" />
      <stop offset="80%" stop-color="#09090b" />
    </linearGradient>

    <linearGradient id="armorPlateGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="saaedGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="legUpperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <linearGradient id="legLowerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52525b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <radialGradient id="jointHub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#71717a" />
      <stop offset="60%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>

    <radialGradient id="wheelTire" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="65%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <radialGradient id="rimCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="85%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>

    <linearGradient id="lidarGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0891b2" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.95" />
    </linearGradient>

    <radialGradient id="sensorLens" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="90%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <radialGradient id="beaconRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="70%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </radialGradient>

    <radialGradient id="beaconBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="shadowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
    <filter id="laserGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- GROUND CONTACT SHADOWS -->
  <ellipse cx="400" cy="485" rx="360" ry="24" fill="#000000" opacity="0.65" filter="url(#shadowBlur)" />
  <ellipse cx="140" cy="480" rx="42" ry="10" fill="#000000" opacity="0.8" filter="url(#shadowBlur)" />
  <ellipse cx="280" cy="460" rx="38" ry="8" fill="#000000" opacity="0.6" filter="url(#shadowBlur)" />
  <ellipse cx="530" cy="455" rx="38" ry="8" fill="#000000" opacity="0.6" filter="url(#shadowBlur)" />
  <ellipse cx="660" cy="475" rx="48" ry="12" fill="#000000" opacity="0.8" filter="url(#shadowBlur)" />

  <!-- ================= BACKGROUND / FAR LEGS (FAR SIDE) ================= -->
  <!-- Far Rear Leg (Left rear in perspective) -->
  <g opacity="0.8" filter="brightness(0.7)">
    <!-- Hip Joint Far Rear -->
    <circle cx="270" cy="245" r="28" fill="url(#jointHub)" stroke="#3f3f46" stroke-width="2" />
    <!-- Upper Leg -->
    <path d="M260,245 L200,340 L225,350 L280,255 Z" fill="url(#legUpperGrad)" stroke="#18181b" stroke-width="2" />
    <!-- Knee Joint -->
    <circle cx="212" cy="345" r="18" fill="url(#jointHub)" stroke="#52525b" stroke-width="2" />
    <!-- Lower Leg with Actuator -->
    <path d="M212,345 L280,440 L295,435 L225,340 Z" fill="url(#legLowerGrad)" />
    <!-- Far Rear Wheel Hub & Tire -->
    <circle cx="285" cy="450" r="32" fill="url(#wheelTire)" stroke="#09090b" stroke-width="4" />
    <circle cx="285" cy="450" r="18" fill="url(#rimCenter)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="285" cy="450" r="6" fill="#f8fafc" />
  </g>

  <!-- Far Front Leg (Right front in perspective) -->
  <g opacity="0.8" filter="brightness(0.7)">
    <!-- Hip Joint Far Front -->
    <circle cx="510" cy="240" r="28" fill="url(#jointHub)" stroke="#3f3f46" stroke-width="2" />
    <!-- Upper Leg -->
    <path d="M510,240 L575,335 L555,345 L495,250 Z" fill="url(#legUpperGrad)" stroke="#18181b" stroke-width="2" />
    <!-- Knee Joint -->
    <circle cx="565" cy="340" r="18" fill="url(#jointHub)" stroke="#52525b" stroke-width="2" />
    <!-- Lower Leg -->
    <path d="M565,340 L530,435 L515,430 L550,335 Z" fill="url(#legLowerGrad)" />
    <!-- Far Front Wheel Hub & Tire -->
    <circle cx="525" cy="445" r="32" fill="url(#wheelTire)" stroke="#09090b" stroke-width="4" />
    <circle cx="525" cy="445" r="18" fill="url(#rimCenter)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="525" cy="445" r="6" fill="#f8fafc" />
  </g>


  <!-- ================= CENTRAL MAIN CHASSIS / TORSO ================= -->
  <!-- Underbody Chassis & Battery Bay -->
  <g>
    <!-- Main base plate -->
    <path d="M190,240 L230,285 L540,280 L590,230 L550,195 L220,200 Z" fill="url(#bodyGrad)" stroke="#27272a" stroke-width="3" />
    
    <!-- Heat sink / cooling vents on belly -->
    <line x1="260" y1="270" x2="310" y2="270" stroke="#09090b" stroke-width="4" stroke-linecap="round" />
    <line x1="260" y1="276" x2="310" y2="276" stroke="#09090b" stroke-width="4" stroke-linecap="round" />
    <line x1="330" y1="270" x2="380" y2="270" stroke="#09090b" stroke-width="4" stroke-linecap="round" />
    <line x1="330" y1="276" x2="380" y2="276" stroke="#09090b" stroke-width="4" stroke-linecap="round" />
    <line x1="400" y1="268" x2="450" y2="268" stroke="#09090b" stroke-width="4" stroke-linecap="round" />
    <line x1="400" y1="274" x2="450" y2="274" stroke="#09090b" stroke-width="4" stroke-linecap="round" />

    <!-- Sleek Armored Shell / Top Body Cover -->
    <path d="M180,230 Q220,175 320,165 L480,165 Q560,170 610,210 L595,245 L540,255 L230,260 Z" fill="url(#armorPlateGrad)" stroke="#cbd5e1" stroke-width="2" />

    <!-- Carbon Fiber Side Inset Panel -->
    <path d="M240,245 L320,185 L460,185 L530,235 L500,250 L260,252 Z" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
    <!-- Carbon pattern texture simulation -->
    <line x1="260" y1="240" x2="500" y2="240" stroke="#27272a" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="280" y1="220" x2="480" y2="220" stroke="#27272a" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="310" y1="200" x2="460" y2="200" stroke="#27272a" stroke-width="1" stroke-dasharray="3 3" />

    <!-- UAE SAAED Emerald Green Racing / Law Enforcement Accent Stripe -->
    <path d="M210,225 L315,175 L475,175 L565,225 L550,233 L470,183 L318,183 L215,233 Z" fill="url(#saaedGreenGrad)" />
    <!-- Thin Gold Accent Line -->
    <path d="M225,234 L318,186 L468,186 L545,234" stroke="url(#goldAccent)" stroke-width="2.5" fill="none" />

    <!-- SAAED & LYNX M20 BRANDING BADGES -->
    <g transform="translate(325, 205)">
      <!-- Badge backing -->
      <rect x="0" y="0" width="135" height="34" rx="6" fill="#09090b" stroke="#10b981" stroke-width="1.2" />
      <!-- Falcon / Emblem icon -->
      <polygon points="12,17 18,9 24,17 18,25" fill="#10b981" />
      <circle cx="18" cy="17" r="3" fill="#ffffff" />
      <!-- Text: SAAED -->
      <text x="32" y="16" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" letter-spacing="1.5">SAAED</text>
      <!-- Sub-label: LYNX M20 -->
      <text x="32" y="27" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="9" letter-spacing="2">LYNX M20</text>
    </g>

    <!-- Side Status Telemetry LEDs -->
    <circle cx="480" cy="225" r="3" fill="#10b981" filter="url(#softGlow)" />
    <circle cx="492" cy="225" r="3" fill="#10b981" opacity="0.8" />
    <circle cx="504" cy="225" r="3" fill="#38bdf8" />
  </g>

  <!-- ================= TOP SENSOR SUITE / LIDAR TURRET ================= -->
  <g>
    <!-- Turret Pylon Base -->
    <rect x="360" y="145" width="70" height="22" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    <line x1="365" y1="156" x2="425" y2="156" stroke="#10b981" stroke-width="2" />

    <!-- 360-degree LiDAR Puck (Autonomous Navigation Scanner) -->
    <ellipse cx="395" cy="138" rx="30" ry="12" fill="#09090b" stroke="#52525b" stroke-width="2" />
    <path d="M365,138 L365,116 Q395,108 425,116 L425,138 Z" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
    <!-- Rotating Cyan LiDAR Window -->
    <rect x="370" y="118" width="50" height="12" rx="3" fill="url(#lidarGlass)" stroke="#38bdf8" stroke-width="1.5" filter="url(#laserGlow)" />
    <!-- Puck Cap -->
    <ellipse cx="395" cy="116" rx="30" ry="9" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <circle cx="395" cy="115" r="6" fill="#06b6d4" filter="url(#laserGlow)" />

    <!-- Emergency Strobe Beacon Lightbar (Tactical Red & Blue Police Flasher) -->
    <g transform="translate(440, 142)">
      <rect x="0" y="0" width="36" height="14" rx="4" fill="#09090b" stroke="#3f3f46" stroke-width="1.5" />
      <!-- Red strobe -->
      <rect x="3" y="2" width="14" height="10" rx="2" fill="url(#beaconRed)" filter="url(#laserGlow)" />
      <!-- Blue strobe -->
      <rect x="19" y="2" width="14" height="10" rx="2" fill="url(#beaconBlue)" filter="url(#laserGlow)" />
    </g>

    <!-- Tactical Antenna Mast -->
    <line x1="330" y1="165" x2="310" y2="90" stroke="#71717a" stroke-width="3" stroke-linecap="round" />
    <circle cx="310" cy="88" r="4" fill="#10b981" filter="url(#laserGlow)" />
    <!-- Secondary comms stub -->
    <line x1="340" y1="165" x2="330" y2="120" stroke="#52525b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ================= FRONT HEAD / FORWARD SENSOR HEAD ================= -->
  <g>
    <!-- Head Articulation Module -->
    <path d="M570,205 L625,190 L650,225 L615,250 L570,240 Z" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    <!-- Head Cover Visor -->
    <path d="M580,200 L630,188 L655,215 L625,230 Z" fill="url(#armorPlateGrad)" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Dual Optical Vision Cameras / AI Perception Modules -->
    <ellipse cx="638" cy="216" rx="14" ry="18" fill="#09090b" stroke="#10b981" stroke-width="2" />
    <circle cx="638" cy="216" r="10" fill="url(#sensorLens)" filter="url(#laserGlow)" />
    <circle cx="635" cy="212" r="3" fill="#ffffff" opacity="0.8" />
    
    <!-- Secondary Infrared / Thermal Camera -->
    <circle cx="616" cy="235" r="7" fill="#09090b" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="616" cy="235" r="4" fill="#d97706" />

    <!-- Forward High-Intensity LED Tactical Searchlight -->
    <polygon points="640,238 656,234 656,246 640,244" fill="#ffffff" filter="url(#softGlow)" />
    <!-- Light cone projection -->
    <polygon points="656,236 780,200 780,280 656,244" fill="url(#saaedGreenGrad)" opacity="0.12" />
  </g>


  <!-- ================= FOREGROUND LEGS (NEAR SIDE) ================= -->

  <!-- 1. NEAR REAR LEG (Left side in foreground) -->
  <g>
    <!-- Heavy Duty Shoulder / Hip Servo Actuator -->
    <circle cx="210" cy="255" r="38" fill="url(#jointHub)" stroke="#3f3f46" stroke-width="3" />
    <circle cx="210" cy="255" r="26" fill="#18181b" stroke="#10b981" stroke-width="2" />
    <!-- SAAED Ring Accent on hip -->
    <circle cx="210" cy="255" r="14" fill="#27272a" />
    <circle cx="210" cy="255" r="6" fill="#10b981" filter="url(#laserGlow)" />

    <!-- Upper Leg Femur (High-tech angled carbon truss) -->
    <path d="M195,265 L115,365 L145,378 L225,280 Z" fill="url(#legUpperGrad)" stroke="#27272a" stroke-width="2" />
    <!-- Armor Plate on Upper Leg -->
    <path d="M190,280 L130,355 L145,365 L205,290 Z" fill="url(#armorPlateGrad)" stroke="#cbd5e1" stroke-width="1" />
    <line x1="145" y1="345" x2="195" y2="285" stroke="#10b981" stroke-width="2" />

    <!-- Hydraulic Piston / Damper -->
    <line x1="180" y1="285" x2="135" y2="350" stroke="#71717a" stroke-width="5" stroke-linecap="round" />
    <line x1="180" y1="285" x2="160" y2="315" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

    <!-- Knee Joint Servo -->
    <circle cx="130" cy="370" r="24" fill="url(#jointHub)" stroke="#52525b" stroke-width="3" />
    <circle cx="130" cy="370" r="14" fill="#18181b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="130" cy="370" r="5" fill="#f8fafc" />

    <!-- Lower Leg Strut (Reaches down and backward to wheel) -->
    <path d="M130,370 L135,465 L155,460 L145,365 Z" fill="url(#legLowerGrad)" stroke="#18181b" stroke-width="2" />
    <!-- Reinforcement Rib -->
    <line x1="135" y1="385" x2="142" y2="455" stroke="#10b981" stroke-width="2" />

    <!-- Wheeled-Leg Foot Assembly: Wheel Hub Motor & Deep-Tread Tire -->
    <!-- Wheel Outer Tire -->
    <circle cx="140" cy="465" r="42" fill="url(#wheelTire)" stroke="#09090b" stroke-width="5" />
    <!-- Tire Treads -->
    <g stroke="#27272a" stroke-width="3">
      <line x1="98" y1="465" x2="105" y2="465" />
      <line x1="175" y1="465" x2="182" y2="465" />
      <line x1="140" y1="423" x2="140" y2="430" />
      <line x1="140" y1="500" x2="140" y2="507" />
      <line x1="110" y1="435" x2="116" y2="441" />
      <line x1="164" y1="489" x2="170" y2="495" />
      <line x1="110" y1="495" x2="116" y2="489" />
      <line x1="164" y1="441" x2="170" y2="435" />
    </g>
    <!-- Alloy Rim with SAAED Green Ring -->
    <circle cx="140" cy="465" r="28" fill="url(#rimCenter)" stroke="#34d399" stroke-width="2" />
    <!-- 5-Spoke Wheel Pattern -->
    <circle cx="140" cy="465" r="14" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="140" cy="465" r="6" fill="#10b981" filter="url(#laserGlow)" />
  </g>


  <!-- 2. NEAR FRONT LEG (Right side in foreground) -->
  <g>
    <!-- Heavy Duty Shoulder / Hip Servo Actuator -->
    <circle cx="500" cy="250" r="38" fill="url(#jointHub)" stroke="#3f3f46" stroke-width="3" />
    <circle cx="500" cy="250" r="26" fill="#18181b" stroke="#10b981" stroke-width="2" />
    <!-- SAAED Ring Accent on hip -->
    <circle cx="500" cy="250" r="14" fill="#27272a" />
    <circle cx="500" cy="250" r="6" fill="#10b981" filter="url(#laserGlow)" />

    <!-- Upper Leg Femur (Reaches forward aggressively) -->
    <path d="M505,250 L610,350 L585,368 L485,268 Z" fill="url(#legUpperGrad)" stroke="#27272a" stroke-width="2" />
    <!-- Armor Plate on Upper Leg -->
    <path d="M510,265 L590,345 L575,358 L495,278 Z" fill="url(#armorPlateGrad)" stroke="#cbd5e1" stroke-width="1" />
    <line x1="515" y1="275" x2="575" y2="335" stroke="#10b981" stroke-width="2" />

    <!-- Hydraulic Piston / Damper -->
    <line x1="515" y1="280" x2="575" y2="340" stroke="#71717a" stroke-width="5" stroke-linecap="round" />
    <line x1="515" y1="280" x2="545" y2="310" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

    <!-- Knee Joint Servo -->
    <circle cx="595" cy="355" r="24" fill="url(#jointHub)" stroke="#52525b" stroke-width="3" />
    <circle cx="595" cy="355" r="14" fill="#18181b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="595" cy="355" r="5" fill="#f8fafc" />

    <!-- Lower Leg Strut (Angles downward to front wheel) -->
    <path d="M595,355 L655,455 L635,465 L580,365 Z" fill="url(#legLowerGrad)" stroke="#18181b" stroke-width="2" />
    <!-- Reinforcement Rib -->
    <line x1="590" y1="375" x2="640" y2="450" stroke="#10b981" stroke-width="2" />

    <!-- Wheeled-Leg Foot Assembly: Front Wheel Hub Motor & Tire -->
    <!-- Wheel Outer Tire -->
    <circle cx="655" cy="460" r="42" fill="url(#wheelTire)" stroke="#09090b" stroke-width="5" />
    <!-- Tire Treads -->
    <g stroke="#27272a" stroke-width="3">
      <line x1="613" y1="460" x2="620" y2="460" />
      <line x1="690" y1="460" x2="697" y2="460" />
      <line x1="655" y1="418" x2="655" y2="425" />
      <line x1="655" y1="495" x2="655" y2="502" />
      <line x1="625" y1="430" x2="631" y2="436" />
      <line x1="679" y1="484" x2="685" y2="490" />
      <line x1="625" y1="490" x2="631" y2="484" />
      <line x1="679" y1="436" x2="685" y2="430" />
    </g>
    <!-- Alloy Rim with SAAED Green Ring -->
    <circle cx="655" cy="460" r="28" fill="url(#rimCenter)" stroke="#34d399" stroke-width="2" />
    <!-- 5-Spoke Wheel Pattern -->
    <circle cx="655" cy="460" r="14" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="655" cy="460" r="6" fill="#10b981" filter="url(#laserGlow)" />
  </g>

  <!-- Ground Environmental Glow Under Wheel Bases -->
  <ellipse cx="140" cy="485" rx="22" ry="5" fill="#10b981" opacity="0.3" filter="url(#laserGlow)" />
  <ellipse cx="655" cy="480" rx="22" ry="5" fill="#10b981" opacity="0.3" filter="url(#laserGlow)" />
</svg>
